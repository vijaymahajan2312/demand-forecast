resources:
  jobs:
    demand_forecasting_model_test:
      name: demand_forecasting_model_test

      tasks:
        - task_key: test_registered_model

          spark_python_task:
            python_file: ../src/test_model.py

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pandas
              - numpy
              - scikit-learn
              - lightgbm
              - mlflow
