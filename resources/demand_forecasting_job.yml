resources:
  jobs:
    demand_forecasting_training:
      name: demand_forecasting_training

      tasks:
        - task_key: train_demand_model

          spark_python_task:
            python_file: ../src/train.py

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pandas==1.5.3
              - numpy==1.26.4
              - scikit-learn==1.3.0
              - lightgbm==4.7.0
              - mlflow==3.16.0
              - scipy==1.11.1
              - cython==0.29.32
              - skops==0.14.0
              - jaraco-collections==5.1.0
